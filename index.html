<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GRI Directive">
<meta name="theme-color" content="#040a07">
<title>GRI Directive</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23040a07'/%3E%3Crect x='34' y='52' width='112' height='76' fill='none' stroke='%233bff9e' stroke-width='7'/%3E%3Crect x='52' y='74' width='30' height='32' fill='%233bff9e'/%3E%3Crect x='92' y='74' width='30' height='32' fill='none' stroke='%234ad9ff' stroke-width='6'/%3E%3C/svg%3E">
<style>
  :root{
    --g:#3bff9e; --g2:#1a7a4d; --g3:#0d3d28; --bg:#040a07; --bg2:#07130d;
    --amb:#ffb347; --b:#4ad9ff; --red:#ff6b6b;
  }
  *{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg)}
  body{color:var(--g);font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:16px;line-height:1.4;
    padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));
    -webkit-user-select:none;user-select:none;position:relative;overflow-x:hidden}
  body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(180deg,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
  input{font:inherit;-webkit-user-select:text;user-select:text}
  :focus-visible{outline:1px solid var(--b);outline-offset:2px}

  .bar{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:9px;letter-spacing:.18em;
    border-bottom:1px solid var(--g3);padding-bottom:8px;margin-bottom:12px}
  .bar .id{color:var(--g);text-shadow:0 0 8px rgba(59,255,158,.55)}
  .bar .st{color:var(--g2);flex:0 0 auto;white-space:nowrap}
  .blink{animation:bl 1.1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}

  .cap{font-size:8.5px;letter-spacing:.2em;color:var(--g2);margin:0 0 6px}
  .cap::before{content:'> '}

  .nodes{display:grid;grid-template-columns:1fr 1fr;gap:3px}
  .nd{border:1px solid var(--g3);background:rgba(59,255,158,.03);padding:9px 8px;font-size:10px;letter-spacing:.06em;
    display:flex;justify-content:space-between;align-items:center;gap:5px;transition:.15s;position:relative;overflow:hidden}
  .nd .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--b);text-shadow:0 0 7px rgba(74,217,255,.32)}
  .nd .hx{font-size:7.5px;color:var(--g2);flex:0 0 auto}
  .nd.on{background:var(--g);border-color:var(--g);box-shadow:0 0 14px rgba(59,255,158,.45)}
  .nd.on .nm{color:var(--bg);text-shadow:none}
  .nd.on .hx{color:rgba(4,10,7,.6)}
  .nd.on::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--amb)}
  .nd:not(.on):active{background:rgba(59,255,158,.12)}

  .ph{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
  .pb{border:1px solid var(--g3);padding:8px 1px;font-size:8.5px;letter-spacing:.04em;text-align:center;
    color:var(--b);transition:.15s;overflow:hidden;text-shadow:0 0 7px rgba(74,217,255,.32)}
  .pb.on{background:var(--amb);border-color:var(--amb);color:var(--bg);box-shadow:0 0 12px rgba(255,179,71,.4);text-shadow:none}
  .pb:not(.on):active{background:rgba(59,255,158,.12)}

  .panel{margin-top:13px;border:1px solid var(--g3);padding:10px;overflow:hidden}
  .plab{font-size:8.5px;letter-spacing:.14em;color:var(--g2);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .read{display:block;font-size:20px;letter-spacing:.04em;color:var(--g);margin:2px 0 8px;
    text-shadow:0 0 9px rgba(59,255,158,.45);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cells{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:100%}
  .cl{height:24px;border:1px solid var(--g3);background:transparent;transition:.1s;width:100%}
  .cl.f{background:var(--g);border-color:var(--g);box-shadow:0 0 9px rgba(59,255,158,.5)}
  .cl.h{background:linear-gradient(90deg,var(--g) 50%,transparent 50%)}
  .scale{display:flex;justify-content:space-between;font-size:7px;color:var(--g3);margin-top:3px}

  .cnt{margin-top:9px;border:1px solid var(--g3);padding:10px;display:flex;align-items:flex-end;
    justify-content:space-between;gap:8px;overflow:hidden}
  .hex{font-size:8px;color:var(--g2);letter-spacing:.08em}
  .btns{display:flex;gap:5px;flex:0 0 auto}
  .cb{border:1px solid var(--g3);width:38px;height:36px;display:flex;align-items:center;justify-content:center;
    font-size:17px;color:var(--g2);transition:.1s}
  .cb:active{background:var(--g);border-color:var(--g);color:var(--bg)}

  .in{width:100%;margin-top:9px;background:rgba(59,255,158,.04);border:1px solid var(--g3);color:var(--g);
    padding:10px;font-size:11px;font-family:inherit;letter-spacing:.04em}
  .in::placeholder{color:var(--g3)}
  .go{width:100%;margin-top:9px;border:1px solid var(--g);color:var(--g);padding:13px;font-size:10px;
    letter-spacing:.2em;text-align:center;transition:.15s;overflow:hidden}
  .go.hot{background:var(--g);color:var(--bg);box-shadow:0 0 22px rgba(59,255,158,.4)}
  .go[disabled]{border-color:var(--g3);color:var(--g3);box-shadow:none}

  .log{margin-top:16px;border-top:1px solid var(--g3);padding-top:10px}
  .rec{font-size:10px;color:var(--g2);padding:7px 0;border-bottom:1px dotted var(--g3);
    display:flex;gap:7px;align-items:baseline;animation:tin .35s ease}
  @keyframes tin{from{opacity:0;transform:translateX(-7px)}to{opacity:1;transform:none}}
  .rec .t{color:var(--g3);flex:0 0 auto}
  .rec .m{flex:1;color:var(--g);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rec .v{flex:0 0 auto;color:var(--amb)}
  .rec .k{flex:0 0 auto;color:var(--g3);font-size:13px;padding:2px 4px}
  .rec .k:active{color:var(--red)}
  .none{font-size:9px;color:var(--g3);letter-spacing:.14em;padding:10px 0}

  .ftr{display:flex;justify-content:space-between;gap:6px;font-size:8.5px;letter-spacing:.1em;color:var(--g2);
    margin-top:12px;border-top:1px solid var(--g3);padding-top:10px;overflow:hidden}
  .ftr span,.ftr button{white-space:nowrap}
  .ftr button{color:var(--b);letter-spacing:.1em;font-size:8.5px}

  .sheet{position:fixed;inset:0;background:var(--bg);padding:20px 14px;display:none;flex-direction:column;gap:12px;
    z-index:40;overflow:auto}
  .sheet.open{display:flex}
  .sheet h2{font-size:10px;letter-spacing:.22em;margin:0;color:var(--g);font-weight:400}
  .sheet .close{position:absolute;top:16px;right:16px;font-size:20px;color:var(--g2);padding:4px 8px}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .acts button{border:1px solid var(--g3);color:var(--b);padding:10px 13px;font-size:9px;letter-spacing:.14em}
  .acts button:active{background:var(--g);border-color:var(--g);color:var(--bg)}
  table{width:100%;border-collapse:collapse;font-size:10px}
  th{color:var(--g3);font-weight:400;text-align:right;padding:6px 3px;border-bottom:1px solid var(--g3);
    letter-spacing:.1em;font-size:8px}
  th:first-child,td:first-child{text-align:left}
  td{text-align:right;padding:6px 3px;border-bottom:1px dotted var(--g3);color:var(--amb)}
  td:first-child{color:var(--g)}
  .tip{font-size:8.5px;color:var(--g3);line-height:1.7;letter-spacing:.06em}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(18px);
    background:var(--g);color:var(--bg);padding:9px 18px;font-size:9px;letter-spacing:.2em;
    opacity:0;transition:.2s;pointer-events:none;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bar">
  <span class="id">GRI//DIRECTIVE</span>
  <span class="st" id="stamp">&#9608;</span>
</div>

<p class="cap">SELECT NODE</p>
<div class="nodes" id="nodes"></div>

<p class="cap" style="margin-top:13px;">PROCESS</p>
<div class="ph" id="phase"></div>

<div class="panel">
  <p class="plab">DURATION</p>
  <span class="read" id="hrsRead">0.0 H</span>
  <div class="cells" id="cells"></div>
  <div class="scale"><span>0</span><span>5</span><span>10</span></div>
</div>

<div class="cnt">
  <div>
    <p class="plab">ASSETS CAPTURED</p>
    <span class="read" id="imgRead" style="margin-bottom:0">0000</span>
    <span class="hex" id="imgHex">0x0000</span>
  </div>
  <div class="btns">
    <button class="cb" id="dec" aria-label="Fewer assets">&minus;</button>
    <button class="cb" id="inc" aria-label="More assets">+</button>
  </div>
</div>

<input class="in" id="note" placeholder="// annotation" autocomplete="off" autocapitalize="sentences">
<button class="go" id="commit" disabled>NO NODE SELECTED</button>

<div class="log">
  <p class="cap">SESSION LOG</p>
  <div id="logList"></div>
  <p class="none" id="logNone">NO RECORDS WRITTEN</p>
</div>

<div class="ftr">
  <span id="totH">0.0H</span>
  <span id="totI">0 ASSETS</span>
  <button id="openMonth">MONTH</button>
  <button id="openHist">DUMP &#8681;</button>
</div>

<div class="sheet" id="sheet">
  <button class="close" id="closeSheet" aria-label="Close">&#10005;</button>
  <h2 id="sheetTitle">ARCHIVE</h2>
  <div class="acts">
    <button id="exportBtn">EXPORT CSV</button>
    <button id="copyBtn">COPY CSV</button>
  </div>
  <p class="tip" id="lastExport"></p>
  <div id="sheetBody"></div>
  <p class="tip">LOCAL STORAGE ONLY &mdash; NOTHING TRANSMITTED.<br>EXPORT PERIODICALLY; A BROWSER PURGE CAN CLEAR THIS DEVICE.</p>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var KEY='gri.directive.console.v1';
  var NODES=[
    ['1A','GEHRY.MODELS','Gehry Models'],
    ['1B','GEHRY.DRAW','Gehry Drawings'],
    ['2A','GAMMA.SCRR','GAMMA/SCRR'],
    ['2B','PRW','PRW'],
    ['3A','HUNT','HUNT'],
    ['3B','JPCA','JPCA'],
    ['4A','DoD','DoD'],
    ['4B','ADMIN','Admin']
  ];
  var PROC=[['CAPT','Capture'],['POST','Post'],['DEPO','Deposit'],['PREP','Prep'],['PLAN','Planning']];

  function pad(n,w){return String(n).padStart(w||2,'0');}
  function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}

  var store={entries:[],lastExport:null};
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ store=JSON.parse(raw); store.entries=store.entries||[]; }
  }catch(e){ console.warn('read failed',e); }

  var saveTimer=null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      try{ localStorage.setItem(KEY,JSON.stringify(store)); }
      catch(e){ toast('SAVE FAILED'); console.warn(e); }
    },100);
  }

  var today=dkey(new Date());
  (function stampDate(){
    var d=new Date();
    var days=['SUN','MON','TUE','WED','THU','FRI','SAT'];
    var mons=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    document.getElementById('stamp').innerHTML=
      days[d.getDay()]+' '+pad(d.getDate())+' '+mons[d.getMonth()]+' <span class="blink">\u2588</span>';
  })();

  var toastEl=document.getElementById('toast'), tTimer=null;
  function toast(m){
    toastEl.textContent=m; toastEl.classList.add('show');
    clearTimeout(tTimer);
    tTimer=setTimeout(function(){ toastEl.classList.remove('show'); },1500);
  }
  function buzz(){ if(navigator.vibrate) navigator.vibrate(8); }

  var hrs=0, imgs=0, node=null, proc=null;

  // ---- nodes ----
  var nw=document.getElementById('nodes');
  var nodeBtns=NODES.map(function(n){
    var b=document.createElement('button');
    b.className='nd'; b.setAttribute('aria-pressed','false');
    b.innerHTML='<span class="nm"></span><span class="hx"></span>';
    b.querySelector('.nm').textContent=n[1];
    b.querySelector('.hx').textContent=n[0];
    b.addEventListener('click',function(){
      var was=b.classList.contains('on');
      nodeBtns.forEach(function(x){ x.classList.remove('on'); x.setAttribute('aria-pressed','false'); });
      if(was){ node=null; } else { b.classList.add('on'); b.setAttribute('aria-pressed','true'); node=n[2]; }
      buzz(); sync();
    });
    nw.appendChild(b);
    return b;
  });

  // ---- process ----
  var pw=document.getElementById('phase');
  var procBtns=PROC.map(function(p){
    var b=document.createElement('button');
    b.className='pb'; b.textContent=p[0]; b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){
      var was=b.classList.contains('on');
      procBtns.forEach(function(x){ x.classList.remove('on'); x.setAttribute('aria-pressed','false'); });
      if(was){ proc=null; } else { b.classList.add('on'); b.setAttribute('aria-pressed','true'); proc=p[1]; }
      buzz();
    });
    pw.appendChild(b);
    return b;
  });

  // ---- duration cells ----
  var cw=document.getElementById('cells');
  for(var i=0;i<10;i++){
    (function(i){
      var c=document.createElement('button');
      c.className='cl';
      c.setAttribute('aria-label','Set duration to '+(i+1)+' hours');
      c.addEventListener('click',function(e){
        var r=c.getBoundingClientRect();
        var x=(e.clientX!==undefined?e.clientX:r.left+r.width/2)-r.left;
        var v=i+(x<r.width/2?0.5:1);
        hrs=(hrs===v)?i:v;
        paintCells(); buzz(); sync();
      });
      cw.appendChild(c);
    })(i);
  }
  function paintCells(){
    [].forEach.call(cw.children,function(c,i){
      c.className='cl'+(hrs>=i+1?' f':(hrs>=i+0.5?' h':''));
    });
    document.getElementById('hrsRead').textContent=hrs.toFixed(1)+' H';
  }

  // ---- asset counter ----
  function paintCount(){
    document.getElementById('imgRead').textContent=pad(Math.min(imgs,9999),4);
    document.getElementById('imgHex').textContent='0x'+imgs.toString(16).toUpperCase().padStart(4,'0');
  }
  function hold(el,fn){
    var timer=null,n=0;
    function start(e){
      if(e.cancelable) e.preventDefault();
      fn(1); buzz(); n=0;
      timer=setInterval(function(){ n++; fn(n>14?50:(n>7?10:1)); },140);
    }
    function stop(){ clearInterval(timer); timer=null; }
    el.addEventListener('touchstart',start,{passive:false});
    el.addEventListener('touchend',stop); el.addEventListener('touchcancel',stop);
    el.addEventListener('mousedown',start); el.addEventListener('mouseup',stop); el.addEventListener('mouseleave',stop);
  }
  hold(document.getElementById('inc'),function(n){ imgs+=n; paintCount(); sync(); });
  hold(document.getElementById('dec'),function(n){ imgs=Math.max(0,imgs-n); paintCount(); sync(); });

  // ---- commit state ----
  var commit=document.getElementById('commit');
  function sync(){
    var ok=!!node && (hrs>0 || imgs>0);
    commit.disabled=!ok;
    commit.textContent=!node ? 'NO NODE SELECTED' : (ok ? '\u25B6 COMMIT RECORD' : 'SET DURATION');
    commit.classList.toggle('hot',ok);
  }

  // ---- session log ----
  var logList=document.getElementById('logList'), logNone=document.getElementById('logNone');
  function todays(){ return store.entries.filter(function(e){ return e.date===today; }); }
  function paintLog(){
    logList.innerHTML='';
    var rows=todays();
    logNone.style.display=rows.length?'none':'block';
    var th=0,ti=0;
    rows.forEach(function(e){
      th+=e.hours; ti+=e.images;
      var d=document.createElement('div'); d.className='rec';
      var t=document.createElement('span'); t.className='t'; t.textContent=e.time;
      var m=document.createElement('span'); m.className='m';
      m.textContent=e.node+(e.phase?'::'+e.phase.toUpperCase():'')+(e.note?' /'+e.note:'');
      var v=document.createElement('span'); v.className='v';
      v.textContent=e.hours.toFixed(1)+'H'+(e.images?'\u00B7'+e.images:'');
      var k=document.createElement('button'); k.className='k'; k.setAttribute('aria-label','Delete record'); k.textContent='\u2715';
      k.addEventListener('click',function(){
        var idx=store.entries.indexOf(e);
        if(idx>-1){ store.entries.splice(idx,1); save(); paintLog(); toast('PURGED'); buzz(); }
      });
      d.appendChild(t); d.appendChild(m); d.appendChild(v); d.appendChild(k);
      logList.appendChild(d);
    });
    document.getElementById('totH').textContent=(Math.round(th*10)/10).toFixed(1)+'H';
    document.getElementById('totI').textContent=ti.toLocaleString()+' ASSETS';
  }

  commit.addEventListener('click',function(){
    if(!node || (hrs<=0 && imgs<=0)) return;
    var now=new Date();
    store.entries.push({
      date:today,
      time:pad(now.getHours())+':'+pad(now.getMinutes()),
      node:node.toUpperCase(),
      project:node,
      phase:proc||'',
      hours:hrs,
      images:imgs,
      note:document.getElementById('note').value.trim(),
      at:now.toISOString()
    });
    save();
    hrs=0; imgs=0; node=null; proc=null;
    nodeBtns.forEach(function(x){ x.classList.remove('on'); x.setAttribute('aria-pressed','false'); });
    procBtns.forEach(function(x){ x.classList.remove('on'); x.setAttribute('aria-pressed','false'); });
    document.getElementById('note').value='';
    paintCells(); paintCount(); sync(); paintLog();
    toast('RECORD WRITTEN'); buzz();
  });

  // ---- CSV ----
  function esc(v){
    v=String(v==null?'':v);
    return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  }
  function csv(){
    var out=[['date','time','project','phase','images','hours','note'].join(',')];
    store.entries.slice().sort(function(a,b){
      return a.date===b.date ? (a.at<b.at?-1:1) : (a.date<b.date?-1:1);
    }).forEach(function(e){
      out.push([e.date,e.time,esc(e.project||e.node),esc(e.phase),e.images,e.hours,esc(e.note)].join(','));
    });
    return out.join('\n');
  }

  // ---- sheet ----
  var sheet=document.getElementById('sheet');
  function open(title,html){
    document.getElementById('sheetTitle').textContent=title;
    document.getElementById('sheetBody').innerHTML=html;
    document.getElementById('lastExport').textContent=
      store.lastExport ? 'LAST EXPORT: '+store.lastExport : 'NEVER EXPORTED';
    sheet.classList.add('open');
  }
  document.getElementById('closeSheet').addEventListener('click',function(){ sheet.classList.remove('open'); });

  function safe(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

  function histHTML(){
    if(!store.entries.length) return '<p class="tip">NO RECORDS</p>';
    var by={};
    store.entries.forEach(function(e){
      if(!by[e.date]) by[e.date]={h:0,i:0,n:0};
      by[e.date].h+=e.hours; by[e.date].i+=e.images; by[e.date].n++;
    });
    var h='<table><tr><th>DATE</th><th>REC</th><th>HRS</th><th>ASSETS</th></tr>';
    Object.keys(by).sort().reverse().forEach(function(k){
      var d=by[k];
      h+='<tr><td>'+k+'</td><td>'+d.n+'</td><td>'+(Math.round(d.h*10)/10).toFixed(1)+'</td><td>'+d.i.toLocaleString()+'</td></tr>';
    });
    return h+'</table>';
  }
  function monthHTML(){
    var ym=today.slice(0,7);
    var rows=store.entries.filter(function(e){ return e.date.slice(0,7)===ym; });
    if(!rows.length) return '<p class="tip">NOTHING LOGGED THIS MONTH</p>';
    var by={};
    rows.forEach(function(e){
      var k=(e.project||e.node)+(e.phase?' \u00B7 '+e.phase:'');
      if(!by[k]) by[k]={h:0,i:0};
      by[k].h+=e.hours; by[k].i+=e.images;
    });
    var th=0,ti=0;
    var h='<table><tr><th>PROJECT &middot; PHASE</th><th>HRS</th><th>ASSETS</th></tr>';
    Object.keys(by).sort().forEach(function(k){
      var d=by[k]; th+=d.h; ti+=d.i;
      h+='<tr><td>'+safe(k)+'</td><td>'+(Math.round(d.h*10)/10).toFixed(1)+'</td><td>'+d.i.toLocaleString()+'</td></tr>';
    });
    h+='<tr><td>TOTAL</td><td>'+(Math.round(th*10)/10).toFixed(1)+'</td><td>'+ti.toLocaleString()+'</td></tr></table>';
    return h;
  }
  document.getElementById('openHist').addEventListener('click',function(){ open('ARCHIVE',histHTML()); });
  document.getElementById('openMonth').addEventListener('click',function(){ open('MONTH ROLLUP',monthHTML()); });

  document.getElementById('exportBtn').addEventListener('click',function(){
    if(!store.entries.length){ toast('NOTHING TO EXPORT'); return; }
    var blob=new Blob([csv()],{type:'text/csv'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='gri-directive-'+today+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
    store.lastExport=today; save();
    document.getElementById('lastExport').textContent='LAST EXPORT: '+today;
    toast('EXPORTED');
  });
  document.getElementById('copyBtn').addEventListener('click',function(){
    var text=csv();
    function ok(){ toast('COPIED'); }
    function fb(){
      var ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ toast('COPY FAILED'); }
      ta.remove();
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok,fb); }
    else fb();
  });

  setInterval(function(){ if(dkey(new Date())!==today) location.reload(); },60000);
  document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

  paintCells(); paintCount(); sync(); paintLog();
})();
</script>
</body>
</html>
